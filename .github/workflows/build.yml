# GitHub Actions 工作流 — 自动编译 LocationHook.dylib
# 你只需要把代码 push 到 GitHub，就能自动得到编译好的 dylib
# 
# 使用方式：
# 1. 在 https://github.com 注册账号
# 2. 点右上角 "+" → New repository → 随便起个名字
# 3. 在本地用 git 上传代码（不会 git 的话看下面 README）
# 4. 上传后自动编译，编译好的 dylib 在 Actions 页面可下载

name: Build LocationHook.dylib

# 触发方式
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # 手动触发（在 GitHub Actions 页面点按钮）
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # 使用 Mac 环境

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 检查 Xcode 环境
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 📦 编译 dylib
        run: |
          clang -shared \
                -arch arm64 \
                -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
                -framework Foundation \
                -framework CoreLocation \
                -framework UIKit \
                -framework UserNotifications \
                -fobjc-arc -O2 -dynamiclib \
                -miphoneos-version-min=14.0 \
                -o LocationHook.dylib \
                LocationHook.m ConfigManager.m FloatingMenu.m

      - name: ✅ 验证编译结果
        run: |
          echo "=== 文件信息 ==="
          file LocationHook.dylib
          echo ""
          echo "=== 符号表 ==="
          nm -gU LocationHook.dylib | head -20

      - name: 📤 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: LocationHook.dylib
          path: LocationHook.dylib
          if-no-files-found: error

      - name: ✅ 编译完成
        run: echo "🎉 编译成功！在 Actions 页面下载 LocationHook.dylib"
